{{ if .Date }}
<div class="page-meta">
  <p>{{ with (index .Site.Data.messages.locales .Site.Language.Lang) }}{{ .updated }} {{ end }}
    {{ if .Lastmod }}<time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}" itemprop="dateModified">{{ .Lastmod.Format "January 02, 2006" }}</time>{{ else }}<time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}" itemprop="datePublished">{{ .Date.Format "January 02, 2006" }}</time>{{ end }}
  </p>
</div>
{{ end }}
