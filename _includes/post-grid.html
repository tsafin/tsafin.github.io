<article class="tile" itemscope itemtype="http://schema.org/Article">
    <a href="{{ post.url | relative_url }}" title="{{ post.title }}" class="post-teaser">
    {% if post.image.teaser %}<img src="{{ post.image.teaser | prepend: '/images/' | relative_url }}" alt="teaser" itemprop="image">
    {% elsif post.thumbnail %}<img src="{{ post.thumbnail | relative_url }}" alt="thumbnail" itemprop="image">
    {% else %}<img src="{{ site.teaser | prepend: '/images/' | relative_url }}" alt="teaser" itemprop="image">{% endif %}</a> {% if post.date %}
    <p class="entry-date date published"><time datetime="{{ post.date | date: " %Y-%m-%d " }}" itemprop="datePublished">{{ post.date | date: "%B %d, %Y" }}</time></p>{% endif %}
    <h2 class="post-title" itemprop="name"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p class="post-excerpt" itemprop="description">{{ post.excerpt | strip_html | truncate: 160 }}</p>
</article>
<!-- /.tile -->
