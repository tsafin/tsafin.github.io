<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ .Title }} • {{ .Site.Title }}{{ end }}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #fafbfc; color: #222; }
      header, footer { background: #222; color: #fff; padding: 1rem; text-align: center; }
      main { max-width: 800px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2rem; }
      h1, h2, h3 { color: #1a4b7a; }
      a { color: #1a4b7a; text-decoration: none; }
      a:hover { text-decoration: underline; }
      img { max-width: 100%; height: auto; border-radius: 4px; }
      @media (max-width: 600px) {
        main { padding: 1rem; margin: 0.5rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" style="color:#fff;text-decoration:none;"><strong>{{ .Site.Title }}</strong></a>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      &copy; {{ now.Year }} {{ .Site.Title }}
    </footer>
  </body>
</html>
