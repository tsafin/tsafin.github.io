<nav role="navigation" id="js-menu" class="sliding-menu-content">
  <h5>{{ .Site.Title }} <span>{{ with (index .Site.Data.messages.locales .Site.Language.Lang) }}{{ .toc }}{{ end }}</span></h5>
  <ul class="menu-item">
    {{ range .Site.Data.navigation }}<li>
      <a href="{{ .url }}">
        {{ with .image }}<img src="{{ $.Site.BaseURL }}images/{{ . }}" alt="teaser" class="teaser">{{ end }}
        <div class="title">{{ .title }}</div>
        {{ with .excerpt }}<p class="excerpt">{{ . }}</p>{{ end }}
      </a>
    </li>{{ end }}
  </ul>
</nav>
<button type="button" id="js-menu-trigger" class="sliding-menu-button lines-button x2" role="button" aria-label="Toggle Navigation">
  <span class="nav-lines"></span>
</button>
<div id="js-menu-screen" class="menu-screen"></div>
