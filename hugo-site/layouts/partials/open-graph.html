<!-- Twitter Cards -->
<meta name="twitter:title" content="{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
{{ with .Description }}<meta name="twitter:description" content="{{ . }}">{{ end }}
{{ with .Site.Params.twitter }}<meta name="twitter:site" content="@{{ . }}">{{ end }}
{{ with .Params.author }}<meta name="twitter:creator" content="@{{ . }}">{{ end }}
{{ with .Params.image.feature }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ $.Site.BaseURL }}images/{{ . }}">
{{ else }}
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="{{ with $.Params.image.thumb }}{{ $.Site.BaseURL }}images/{{ . }}{{ else }}{{ $.Site.BaseURL }}images/{{ $.Site.Params.logo }}{{ end }}">
{{ end }}
<!-- Open Graph -->
<meta property="og:locale" content="{{ .Site.Language.Lang }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
{{ with .Description }}<meta property="og:description" content="{{ . }}">{{ end }}
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
