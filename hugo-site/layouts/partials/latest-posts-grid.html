<div class="archive-wrap">
  <h3>Latest {{ with (index .Params.categories 0) }}{{ . | humanize | title }}{{ end }}</h3>
  <ul class="th-grid">
    {{ $cat := (index .Params.categories 0) }}
    {{ range first 4 (where .Site.RegularPages "Params.categories" "intersect" (slice $cat)) }}
      <li><a href="{{ .RelPermalink }}" title="{{ .Title }}"><img src="{{ .Site.BaseURL }}images/{{ .Params.image.thumb }}" alt=""></a></li>
    {{ end }}
  </ul>
</div>
